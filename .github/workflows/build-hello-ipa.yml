name: Build HelloiPhone ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift Package for iOS
        run: |
          set -e
          xcodebuild \
            -scheme HelloIphone \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build
          find . -name "HelloIphone.app" -type d

      - name: Locate .app
        id: locate
        run: |
          app=$(find . -name "HelloIphone.app" -type d | head -n 1)
          [ -z "$app" ] && { echo "No .app found"; find . -name "*.app" 2>/dev/null; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Found: $app"

      - name: Package .ipa
        run: |
          set -e
          workdir=ipa_payload
          mkdir -p "$workdir/Payload"
          cp -R "${{ steps.locate.outputs.app }}" "$workdir/Payload/"
          (cd "$workdir" && zip -qr -y ../HelloIphone.ipa Payload)
          ls -la HelloIphone.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloIphone-ipa
          path: HelloIphone.ipa
          if-no-files-found: error