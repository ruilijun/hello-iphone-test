name: Build HelloiPhone ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build for device
        run: |
          set -euo pipefail
          xcodebuild \
            -project HelloIphone.xcodeproj \
            -target HelloIphone \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          ls -la "$PWD/build/Release-iphoneos"

      - name: Package ipa
        run: |
          set -euo pipefail
          APP="$PWD/build/Release-iphoneos/HelloIphone.app"
          test -d "$APP"
          rm -rf ipa_payload
          mkdir -p ipa_payload/Payload
          cp -R "$APP" ipa_payload/Payload/
          cd ipa_payload
          zip -qry ../HelloIphone.ipa Payload
          cd ..
          ls -la HelloIphone.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: HelloIphone-ipa
          path: HelloIphone.ipa
          if-no-files-found: error
