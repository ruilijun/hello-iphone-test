name: HelloIphone
options:
  bundleId: com.fucai.helloiphone
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  HelloIphone:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: HelloIphone/Info.plist
      properties:
        CFBundleDisplayName: Hello iPhone
        CFBundleIdentifier: com.fucai.helloiphone
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight